# Builds the iOS app and uploads it to TestFlight (App Store Connect). Run it by hand:
# Actions tab → "iOS app to TestFlight" → Run workflow. No Mac needed. See docs/ios-app.md.
#
# Needs these repository secrets (Settings → Secrets and variables → Actions):
#   APPLE_TEAM_ID       10-character Team ID (developer.apple.com → Membership details)
#   ASC_KEY_ID          App Store Connect API key ID (Users and Access → Integrations → Keys, role Admin)
#   ASC_ISSUER_ID       Issuer ID shown above that key list
#   ASC_PRIVATE_KEY     the whole text of the downloaded AuthKey_XXXX.p8 file
#
# Only needed when the app shell changes (capacitor.config.ts, ios/, native plugins, icon).
# Website changes reach the app as soon as they are published; no new build is needed for them.
name: iOS app to TestFlight
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version shown in the App Store (e.g. 1.0, 1.1)"
        required: true
        default: "1.0"
jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: npx cap sync ios

      - name: Check the secrets are set
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          missing=""
          for v in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then echo "::error::Add these repository secrets first:$missing (see docs/ios-app.md)"; exit 1; fi

      - name: Save the App Store Connect key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          key="$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          # Pasted keys often lose their line breaks or gain spaces. Keep only the base64 body and rebuild a clean file.
          body=$(printf '%s' "$ASC_PRIVATE_KEY" | tr -d '\r' | sed -e 's/-----BEGIN PRIVATE KEY-----//' -e 's/-----END PRIVATE KEY-----//' | tr -d ' \n\t')
          { echo "-----BEGIN PRIVATE KEY-----"; printf '%s' "$body" | fold -w 64; echo; echo "-----END PRIVATE KEY-----"; } > "$key"
          if ! openssl pkey -in "$key" -noout 2>/dev/null; then
            echo "::error::ASC_PRIVATE_KEY is not a valid .p8 key. Open the AuthKey_XXXX.p8 file in a text editor, copy everything (BEGIN and END lines included) and save it again as the secret."
            exit 1
          fi

      - name: Build (archive)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          # Build without signing. Apple's own signing for the App Store happens in the next step (export),
          # which makes the distribution certificate and profile in the cloud. Signing here would ask for a
          # registered test device, which this team doesn't have.
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            MARKETING_VERSION="${{ inputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: Upload to TestFlight
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Uploaded build ${{ github.run_number }} (version ${{ inputs.version }}). It shows in App Store Connect → TestFlight after Apple finishes processing (usually 10 to 30 minutes)."

      - name: Show why the export failed
        if: failure()
        run: |
          for d in $(find "${TMPDIR:-/tmp}" -maxdepth 2 -name '*.xcdistributionlogs' 2>/dev/null); do
            for f in "$d"/*.log; do
              echo "=== $f"
              grep -iE "error|fail|agreement|forbidden|unauthori|not found|no (app|account|team|profile|cert)|status|code" "$f" | head -60
            done
          done

      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
