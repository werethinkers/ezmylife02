name: Deploy server functions

# Deploys the Supabase edge functions whenever a change to them reaches `main`, so nobody has to ask the
# Lovable agent (which spends credits). Needs one repository secret: SUPABASE_ACCESS_TOKEN
# (Supabase dashboard > Account > Access Tokens). Until it is set, the run stops with a clear message.
on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add the SUPABASE_ACCESS_TOKEN repository secret to deploy functions automatically."
            exit 1
          fi
          supabase functions deploy --project-ref vrsadzjyugbusfazdgyi --use-api
