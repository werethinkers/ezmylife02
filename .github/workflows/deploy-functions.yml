# Deploys changed Supabase edge functions to production on every push to main.
#
# Needs one repository secret (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN   Personal access token from supabase.com/dashboard/account/tokens
#
# The project ref is already in supabase/config.toml (project_id = "vrsadzjyugbusfazdgyi"),
# so no --project-ref flag is needed.  API keys live in the gemini_api_keys DB table and are
# not touched by this workflow.
name: Deploy edge functions
on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch:
    inputs:
      function:
        description: "Function name to deploy (leave empty to deploy all)"
        required: false
        default: ""
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.function }}" ]; then
            echo "Deploying function: ${{ github.event.inputs.function }}"
            supabase functions deploy "${{ github.event.inputs.function }}" --use-api
          else
            echo "Deploying all functions"
            supabase functions deploy --use-api
          fi
